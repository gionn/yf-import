name = "yf-import"
main = "src/index.ts"
compatibility_date = "2026-01-20"

# Cache configuration: time in seconds
[vars]
CACHE_TTL = "3600" # 1 hour
ROOT_REDIRECT_URL = "https://gionn.net/2026/google-sheets-yahoo-finance-fix/"

# NOTE: ALLOWED_ORIGINS is intentionally NOT set here. Everything in [vars] is
# plaintext and committed to this public repository, which would disclose the
# allowlist. Set it as a Worker Secret instead (values are not visible in
# Wrangler or the dashboard once defined):
#
#   npx wrangler secret put ALLOWED_ORIGINS
#   # e.g. https://app.example.com,https://sheets.example.org
#
# Or via the dashboard: Worker > Settings > Variables and Secrets > Add > Secret.
# For local development, copy .dev.vars.example to .dev.vars (gitignored).

# Uncomment to use KV for caching/storage
# [[kv_namespaces]]
# binding = "QUOTES_KV"
# id = "your-kv-namespace-id"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
