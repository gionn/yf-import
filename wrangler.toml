name = "yf-import"
main = "src/index.ts"
compatibility_date = "2026-01-20"

# Cache configuration: time in seconds
[vars]
CACHE_TTL = "3600" # 1 hour
ROOT_REDIRECT_URL = "https://gionn.net/2026/google-sheets-yahoo-finance-fix/"
# Comma-separated list of exact origins allowed to read API responses
# cross-origin (CORS), e.g. "https://app.example.com,https://sheets.example.org".
# Leave empty to disable CORS entirely. The list is never disclosed to callers:
# only the caller's own origin is echoed back, and only when it matches.
ALLOWED_ORIGINS = "http://localhost:5173"

# Uncomment to use KV for caching/storage
# [[kv_namespaces]]
# binding = "QUOTES_KV"
# id = "your-kv-namespace-id"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
